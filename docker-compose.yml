version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: financial-planning-db
    environment:
      POSTGRES_DB: financial_planning
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/backend/src/db/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financial-planning-network

  redis:
    image: redis:7-alpine
    container_name: financial-planning-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - financial-planning-network

  # Adminer for database management (optional)
  adminer:
    image: adminer
    container_name: financial-planning-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - financial-planning-network

volumes:
  postgres_data:
  redis_data:

networks:
  financial-planning-network:
    driver: bridge
